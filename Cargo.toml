[package]
name = "glicol_vst3"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Glicol VST: a Windows VST3 stereo code-based audio instrument"

[lib]
name = "glicol_vst"
crate-type = ["cdylib", "rlib"]

[dependencies]
nice-plug = { path = "vendor/nice-plug/crates/nice-plug", default-features = false, features = ["vst3"] }
baseview = { git = "https://github.com/RustAudio/baseview", rev = "f6e99e9aa6f5aeb6b721cb05e4d882a51d995909" }
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview", rev = "b7436c02309347e49ffd4491bf31cdef6e759eb7" }
egui = "0.15"
raw-window-handle = "0.3"
glicol = { version = "0.12", features = ["use-meta"] }
rtrb = "0.2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["commctrl", "winuser", "commdlg", "winbase"] }

[dev-dependencies]
vst3 = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace]
exclude = [
    "vendor/nice-plug",
    "vendor/nice-plug/crates/nice-plug",
    "vendor/nice-plug/crates/nice-plug-core",
    "vendor/nice-plug/crates/nice-plug-derive",
    "vendor/nice-plug/crates/nice-log",
]

[patch."https://github.com/RustAudio/baseview"]
baseview = { path = "vendor/baseview" }
